# Slackware Extended Mirror Configuration

# Mirror Information
MIRROR_NAME="Slackware Extended"
SLACKWARE_VERSION="slackware64-current"
ARCHITECTURE="x86_64"

# Mirror Sources (rsync)
PRIMARY_MIRROR="rsync://rsync.osuosl.org/slackware/slackware64-current/"
FALLBACK_MIRRORS=(
    "rsync://mirrors.slackware.com/slackware/slackware64-current/"
    "rsync://ftp.slackware.pl/slackware/slackware64-current/"
)

# Extra Packages
SBOTOOLS_VERSION="3.2"
SBOTOOLS_URL="https://github.com/pink-mist/sbotools/releases/download/${SBOTOOLS_VERSION}/sbotools-${SBOTOOLS_VERSION}-noarch-1_SBo.tgz"

SLACKPKGPLUS_VERSION="1.8.0"
SLACKPKGPLUS_URL="https://sourceforge.net/projects/slackpkgplus/files/packages/slackpkg%2B-${SLACKPKGPLUS_VERSION}-noarch-3mt.txz/download"

# Sync Options
SYNC_EXCLUDES=(
    "source/"
    "testing/"
    "pasture/"
    "*.iso"
)

# Directory Structure
LOCAL_MIRROR_DIR="./mirror/slackware64-current"
EXTRA_PACKAGES_DIR="./extra-packages"
ISO_WORK_DIR="./iso-work"

# Sync Schedule
SYNC_SCHEDULE="Daily at 2 AM UTC"
ISO_BUILD_SCHEDULE="Weekly on Sundays at 3 AM UTC"

# Archive.org Publishing
ARCHIVE_ORG_COLLECTION="slackware-extended"
ARCHIVE_ORG_MEDIATYPE="software"

